name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/python/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: backend/python
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'ci_test_key_id' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'ci_test_key_secret' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET || 'ci_test_webhook_secret' }}
        run: pytest backend/python/tests -q
